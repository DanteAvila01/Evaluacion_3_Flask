{% extends "base.html" %}

{% block titulo %}Ejercicio 1{% endblock %}

{% block contenido %}
<section class="tarjeta">
    <h1>Formulario de notas</h1>

    {% if error %}
        <p class="error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('ejercicio1') }}">
        {% for numero in range(1, 4) %}
            <label for="nota{{ numero }}">Nota {{ numero }} (10 a 70)</label>
            <input id="nota{{ numero }}" name="nota{{ numero }}"
                   type="number" min="10" max="70" required>
        {% endfor %}

        <label for="asistencia">Asistencia (%)</label>
        <input id="asistencia" name="asistencia"
               type="number" min="0" max="100" required>

        <button type="submit">Enviar</button>
    </form>

    <p><a href="{{ url_for('inicio') }}">Volver al menú</a></p>
</section>
{% endblock %}

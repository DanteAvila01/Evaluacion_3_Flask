{% extends "base.html" %}

{% block titulo %}Resultado{% endblock %}

{% block contenido %}
<section class="tarjeta">
    <h1>Resultado</h1>

    <dl>
        {% for etiqueta, valor in datos %}
            <dt>{{ etiqueta }}</dt>
            <dd>{{ valor }}</dd>
        {% endfor %}
    </dl>

    <p><a href="{{ url_for(origen) }}">Volver al formulario</a></p>
    <p><a href="{{ url_for('inicio') }}">Volver al menú</a></p>
</section>
{% endblock %}
